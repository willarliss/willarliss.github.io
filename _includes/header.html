<header class="site-header" role="banner">
  <div class="wrap">
    <h1 class="site-title" style="margin:0 0 0.5rem 0;">
      <a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.username }}</a>
    </h1>

    {% if site.description %}
      <p class="site-description">{{ site.description }}</p>
    {% endif %}

    <!-- header ends here; the photo will be placed below the header so main content can flow to its right -->

    <!--
      Minima normally adds a GitHub/Repo link here. This override keeps the
      same structure/classes so the theme styling remains, but deliberately
      omits the GitHub link.
    -->
  </div>
</header>

<!-- Photo placed below the header. It is floated left so the following
     main content will flow to its right. Make sure `photo.png` is in a
     served location (site root or assets) so it loads on the built site. -->
<div style="clear:both; margin-top:-0.6rem;">
  <div style="float:left; width:120px; margin-right:1rem; margin-top:0;">
    <img src="{{ '/photo.png' | relative_url }}" alt="{{ site.title | default: site.github.username }} photo" style="width:96px;height:96px;border-radius:50%;display:block;">
  </div>
</div>
