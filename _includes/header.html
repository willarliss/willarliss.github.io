<header class="site-header" role="banner">
  <div class="wrap">
    <h1 class="site-title" style="margin:0 0 0.5rem 0;">
      <a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.username }}</a>
    </h1>

    {% if site.description %}
      <p class="site-description">{{ site.description }}</p>
    {% endif %}

    <!-- divider before the photo and page intro -->
    <hr style="margin:1rem 0;">

    <!-- Row: photo on the left, header text/intro on the right -->
    <div class="header-row" style="display:flex; align-items:flex-start; gap:1rem;">
      <div class="header-photo" style="flex:0 0 120px; max-width:120px;">
        <img src="{{ '/photo.png' | relative_url }}" alt="{{ site.title | default: site.github.username }} photo" style="width:96px;height:96px;border-radius:50%;display:block;">
      </div>

      <div class="header-intro" style="flex:1;">
        <!-- keep the header-intro empty so the main page content sits naturally to the right of the photo -->
      </div>
    </div>

    <!--
      Minima normally adds a GitHub/Repo link here. This override keeps the
      same structure/classes so the theme styling remains, but deliberately
      omits the GitHub link.
    -->
  </div>
</header>
