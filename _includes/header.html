<header class="site-header" role="banner">
  <div class="wrap" style="display:flex; align-items:flex-start;">
    <div class="site-left" style="min-width:140px; margin-right:1rem; text-align:left;">
      <h1 class="site-title" style="margin:0;">
        <a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.username }}</a>
      </h1>

      {% if site.description %}
        <p class="site-description">{{ site.description }}</p>
      {% endif %}

      <!-- Photo: placed under the site title on the left. Update src to point to a served path. -->
      <img src="{{ '/photo.png' | relative_url }}" alt="{{ site.title | default: site.github.username }} photo" style="width:96px;height:96px;border-radius:50%;margin-top:0.5rem;display:block;">
    </div>

    <div class="site-right" style="flex:1;">
      <!--
        Minima normally adds a GitHub/Repo link here. This override keeps the
        same structure/classes so the theme styling remains, but deliberately
        omits the GitHub link.
      -->
    </div>
  </div>
</header>
